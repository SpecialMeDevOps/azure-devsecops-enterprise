name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-container:
    name: Test and container verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: secureops-api:ci-${{ github.sha }}
      CONTAINER_NAME: secureops-api-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Prepare report and diagnostics directories
        run: mkdir -p test-results diagnostics

      - name: Install application and test dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        timeout-minutes: 5
        run: python -m pytest -ra --junitxml=test-results/junit.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image without pushing
        id: build
        uses: docker/build-push-action@v6
        timeout-minutes: 10
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.IMAGE_TAG }}
          load: true
          push: false
          metadata-file: diagnostics/build-metadata.json

      - name: Run and verify container
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name="${CONTAINER_NAME}"

          cleanup() {
            result=$?
            trap - EXIT
            cleanup_failed=0

            if docker container inspect "$container_name" >/dev/null 2>&1; then
              state="$(docker inspect --format '{{.State.Status}}' "$container_name" 2>/dev/null || echo unknown)"
              if [[ "$state" == "running" ]]; then
                if ! docker stop --time 30 "$container_name" >/dev/null; then
                  echo "Failed to stop container gracefully." >&2
                  cleanup_failed=1
                fi
              fi

              docker logs "$container_name" > diagnostics/container.log 2>&1 || true
              docker inspect "$container_name" > diagnostics/container-inspect.json 2>&1 || true
              state="$(docker inspect --format '{{.State.Status}}' "$container_name" 2>/dev/null || echo unknown)"
              exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_name" 2>/dev/null || echo unknown)"
              echo "Container stopped with state=$state exit_code=$exit_code"

              if [[ "$state" != "exited" || "$exit_code" != "0" ]]; then
                echo "Container did not stop with a successful exit." >&2
                cleanup_failed=1
              fi

              if ! docker rm "$container_name" >/dev/null; then
                echo "Failed to remove the test container." >&2
                cleanup_failed=1
              fi
            fi

            if [[ "$result" -eq 0 && "$cleanup_failed" -ne 0 ]]; then
              result=1
            fi
            exit "$result"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:8000:8000 \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 100 \
            --cpus 1.0 \
            --memory 256m \
            "$IMAGE_TAG" > diagnostics/container-id.txt

          health_status="starting"
          for attempt in $(seq 1 45); do
            container_state="$(docker inspect --format '{{.State.Status}}' "$container_name")"
            health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_name")"

            if [[ "$health_status" == "healthy" ]]; then
              break
            fi
            if [[ "$container_state" != "running" ]]; then
              echo "Container stopped before becoming healthy (state=$container_state)." >&2
              exit 1
            fi
            sleep 2
          done

          if [[ "$health_status" != "healthy" ]]; then
            echo "Container did not become healthy (health=$health_status)." >&2
            exit 1
          fi

          docker exec "$container_name" python -c \
            'import os; assert (os.getuid(), os.getgid()) == (10001, 10001), (os.getuid(), os.getgid())'

          python - <<'PY'
          import json
          from urllib.request import urlopen

          expected_responses = {
              "/": {"name": "SecureOps API", "message": "Welcome to SecureOps API"},
              "/health": {"status": "healthy"},
              "/api/v1/info": {
                  "name": "SecureOps API",
                  "version": "0.1.0",
                  "environment": "production",
              },
              "/api/v1/status": {"status": "running"},
          }

          for path, expected in expected_responses.items():
              with urlopen(f"http://127.0.0.1:8000{path}", timeout=5) as response:
                  actual = json.load(response)
                  assert response.status == 200, f"{path}: HTTP {response.status}"
                  assert actual == expected, f"{path}: expected {expected!r}, got {actual!r}"
                  print(f"{path}: HTTP {response.status}, response verified")
          PY

      - name: Upload test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-and-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            diagnostics/
          if-no-files-found: warn
          retention-days: 7
